# #1155 — Per-IP rate limiting for /graphql
# 100 req/min for authenticated (Bearer present), 30 req/min for anonymous.
# Zones defined at http context level; applied in location /graphql below.
limit_req_zone $binary_remote_addr zone=graphql_auth:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=graphql_anon:10m rate=30r/m;

# #1632 — freio de proxy nos endpoints de auth que fazem hash de senha.
# Argon2 no login/registro e PBKDF2 600k no caminho de e-mail inexistente
# custam CPU antes de qualquer regra do app; 1 vCPU não absorve rajada.
limit_req_zone $binary_remote_addr zone=auth_hash:10m rate=15r/m;

server {
    listen 80;
    server_name api.auraxis.com.br;

    client_max_body_size 10m;

    # Hide server identity — strip upstream (gunicorn) Server header so clients
    # never see backend technology info, and suppress nginx version from error pages.
    server_tokens off;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Consolidate HSTS in one place: nginx is the canonical source.
    # proxy_hide_header strips Flask's own HSTS to prevent the duplicate
    # "Strict-Transport-Security Multiple Header Entries" ZAP finding [10035].
    # This response passes through the ALB to the browser over HTTPS, so the
    # HSTS directive is effective even though nginx listens on HTTP/80 behind ALB.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # SEC-AUD-10 — Unified security-header baseline. The three nginx variants
    # (default.conf, default.tls.conf, default.alb_dual.conf) must emit the
    # same values. Permissions-Policy matches the CloudFront response-headers
    # policy applied to app.auraxis.com.br (SEC-AUD-05). X-XSS-Protection is
    # intentionally absent — deprecated and ignored by modern browsers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # #1155 — GraphQL rate limiting: authenticated requests get a higher budget.
    # Requests carrying a Bearer token use the graphql_auth zone (100 req/min),
    # all others fall back to graphql_anon (30 req/min). burst=20 allows short
    # spikes without immediate 429; nodelay returns 503 immediately on overflow.
    location /graphql {
        limit_req zone=graphql_anon burst=10 nodelay;
        limit_req zone=graphql_auth burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 30s;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # #1632 — /auth/refresh fica FORA de propósito: não faz hash de senha,
    # e o app já o limita a 10/min/IP (tier token_refresh), mais estrito que
    # este freio. Incluí-lo aqui só encolheria a folga de quem está logado.
    location ~ ^/auth/(login|register|password/) {
        limit_req zone=auth_hash burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 30s;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Docker embedded DNS — required for the lazy upstream resolution below.
    resolver 127.0.0.11 valid=30s;

    # #1644 — /v2/* on the v1 hostname, so the mobile app can reach api-v2 with
    # the single base URL it is built with (EXPO_PUBLIC_API_URL). Mirrors the
    # block in default.tls.conf; see that file for the full rationale.
    #
    # proxy_pass carries no URI part on purpose: api-v2 mounts its routers under
    # /v2 itself, so the prefix must survive the hop.
    location /v2/ {
        set $v2_upstream http://auraxis-v2:8001;
        proxy_pass $v2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # An import confirm issues one v1 request per row, so it needs more
        # headroom than a plain read.
        proxy_read_timeout 60s;
    }

    # api-v2 serves /healthz at its root, not under /v2 — this location does
    # replace the prefix, hence the URI part in proxy_pass.
    location = /v2/healthz {
        set $v2_upstream http://auraxis-v2:8001;
        proxy_pass $v2_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 30s;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
